name: Build Touca Editor Android Mobile

on:
  push:
    branches:
      - touca-editor-android-mobile-native
    paths:
      - "touca-android-build/**"
      - ".github/workflows/touca-android-mobile.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Reconstruct native Android source
        shell: bash
        run: |
          mkdir -p touca-mobile-src
          cat touca-android-build/source.b64.part-* | base64 -d > /tmp/touca-mobile-source.tar.gz
          tar xzf /tmp/touca-mobile-source.tar.gz -C touca-mobile-src
          test -f touca-mobile-src/app/build.gradle.kts
          grep -q 'applicationId = "com.toucabr.editor.mobile"' touca-mobile-src/app/build.gradle.kts
          ! grep -R 'android.permission.RECORD_AUDIO' touca-mobile-src/app/src/main/AndroidManifest.xml

      - name: Apply mobile touch compile fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          timeline = Path("touca-mobile-src/app/src/main/java/com/toucabr/editor/ui/components/Timeline.kt")
          s = timeline.read_text()
          if "import com.toucabr.editor.interaction.TimelineGeometry" not in s:
              s = s.replace(
                  "import com.toucabr.editor.interaction.ClipGestureResolver\n",
                  "import com.toucabr.editor.interaction.ClipGestureResolver\nimport com.toucabr.editor.interaction.TimelineGeometry\n"
              )
          s = s.replace(
              "scroll.scrollTo((newScrollDp * density.density).roundToInt().coerceIn(0, scroll.maxValue))",
              "scroll.dispatchRawDelta(((newScrollDp * density.density) - scroll.value).toFloat())"
          )
          s = s.replace(
              "if (s % if (pps < 25) 5 else 1 != 0) continue",
              "if (s % (if (pps < 25) 5 else 1) != 0) continue"
          )
          s = s.replace(
              "TimelineGeometry.zoomAroundCursor(oldPps, scale, cursorDp, oldScrollDp)",
              "TimelineGeometry.zoomAroundCursor(oldPps, scale, cursorDp.toDouble(), oldScrollDp.toDouble())"
          )
          timeline.write_text(s)

          app = Path("touca-mobile-src/app/src/main/java/com/toucabr/editor/ui/ToucaApp.kt")
          s = app.read_text()
          marker = "@Composable\nprivate fun HomeScreen("
          if "@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nprivate fun HomeScreen(" not in s:
              s = s.replace(marker, "@OptIn(ExperimentalMaterial3Api::class)\n" + marker)
          app.write_text(s)

          for test_name in ("ScriptAlignment22Test.kt", "SubtitleCodecTest.kt"):
              p = Path("touca-mobile-src/app/src/test/java/com/toucabr/editor/media/asr") / test_name
              t = p.read_text()
              t = t.replace("import kotlin.test.Test", "import org.junit.Test")
              t = t.replace("import kotlin.test.assertEquals", "import org.junit.Assert.assertEquals")
              t = t.replace("import kotlin.test.assertTrue", "import org.junit.Assert.assertTrue")
              if test_name == "SubtitleCodecTest.kt":
                  t = t.replace("assertEquals(1.0, cues[0].start)", "assertEquals(1.0, cues[0].start, 1e-9)")
                  t = t.replace("assertEquals(2.25, cues[0].end)", "assertEquals(2.25, cues[0].end, 1e-9)")
              p.write_text(t)

          export_test = Path("touca-mobile-src/app/src/test/java/com/toucabr/editor/media/export/ExportTimelineTest.kt")
          t = export_test.read_text()
          t = t.replace("type = ClipType.image,\n        name = id,\n        track = \"main\"", "type = ClipType.video,\n        name = id,\n        track = \"main\"")
          export_test.write_text(t)
          PY

      - name: Restore exact Whisper Tiny assets
        shell: bash
        run: |
          set -euo pipefail
          cd touca-mobile-src/app/src/main/assets/whisper
          BASE="https://huggingface.co/Xenova/whisper-tiny/resolve/c4eb0c76e35cab5b948da877b438dcd6d91d93f4"
          curl -L --fail --retry 4 "$BASE/onnx/encoder_model_quantized.onnx?download=true" -o encoder_model_quantized.onnx
          curl -L --fail --retry 4 "$BASE/onnx/decoder_model_merged_quantized.onnx?download=true" -o decoder_model_merged_quantized.onnx
          cd "$GITHUB_WORKSPACE"
          cat touca-android-build/tokenizer.b64.part-* | base64 -d | gzip -dc > touca-mobile-src/app/src/main/assets/whisper/tokenizer.json
          cd touca-mobile-src/app/src/main/assets/whisper
          echo "fd9d995b9dcb0520f0dbf6cf68651af639fc385f594d9d876e69ca2802dc438e  encoder_model_quantized.onnx" | sha256sum -c -
          echo "6c0c125986b007d2e3734bec84c18bda0152071b90b87fadac6d7764499927a0  decoder_model_merged_quantized.onnx" | sha256sum -c -
          echo "27fc476bfe7f17299480be2273fc0608e4d5a99aba2ab5dec5374b4482d1a566  tokenizer.json" | sha256sum -c -

      - name: Unit tests
        working-directory: touca-mobile-src
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APK
        working-directory: touca-mobile-src
        run: gradle --no-daemon assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find touca-mobile-src/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "$APK"
          unzip -t "$APK" >/tmp/unzip-test.txt
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          "$AAPT" dump permissions "$APK" > /tmp/permissions.txt
          grep -q "package: name='com.toucabr.editor.mobile'" /tmp/badging.txt
          if grep -q "android.permission.RECORD_AUDIO" /tmp/permissions.txt; then
            echo "ERROR: microphone permission still present"
            exit 1
          fi
          grep -q "android.permission.CAMERA" /tmp/permissions.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/signature.txt
          mkdir -p dist
          cp "$APK" dist/ToucaEditor-Android-Mobile-30.2.0.apk
          sha256sum dist/ToucaEditor-Android-Mobile-30.2.0.apk | tee dist/SHA256.txt
          {
            echo "=== BADGING ==="
            cat /tmp/badging.txt
            echo
            echo "=== PERMISSIONS ==="
            cat /tmp/permissions.txt
            echo
            echo "=== SIGNATURE ==="
            cat /tmp/signature.txt
          } > dist/VALIDATION.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToucaEditor-Android-Mobile-30.2.0
          path: |
            dist/ToucaEditor-Android-Mobile-30.2.0.apk
            dist/SHA256.txt
            dist/VALIDATION.txt
          compression-level: 0
          if-no-files-found: error
