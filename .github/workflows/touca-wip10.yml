name: Touca Editor WIP10 Build
on:
  push:
    branches: [touca-editor-wip10-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct native project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wip10-build/ToucaEditorAndroid
          cat .wip10/source.b64.part-* | base64 -d | tar -xzf - -C wip10-build/ToucaEditorAndroid

          if [ -d .wip10/overrides ]; then
            cp -a .wip10/overrides/. wip10-build/ToucaEditorAndroid/
          fi

          python3 - <<'PY'
          from pathlib import Path

          root = Path("wip10-build/ToucaEditorAndroid")

          p = root / "app/src/main/java/com/toucabr/editor/ui/components/EditorPreview.kt"
          s = p.read_text()
          s = s.replace(
              "@OptIn(androidx.media3.common.util.UnstableApi::class)\n@Composable\nprivate fun AudioPreviewLayer",
              "@androidx.media3.common.util.UnstableApi\n@Composable\nprivate fun AudioPreviewLayer",
          )
          p.write_text(s)

          p = root / "app/src/main/java/com/toucabr/editor/EditorViewModel.kt"
          s = p.read_text()
          s = s.replace(
              "@OptIn(UnstableApi::class)\n    fun exportProject()",
              "@UnstableApi\n    fun exportProject()",
          )
          p.write_text(s)

          p = root / "app/src/main/AndroidManifest.xml"
          s = p.read_text()
          if "android.permission.POST_NOTIFICATIONS" not in s:
              s = s.replace(
                  '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
                  '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              )
          p.write_text(s)

          p = root / "app/src/main/java/com/toucabr/editor/service/ExportForegroundService.kt"
          s = p.read_text()
          if "import android.Manifest" not in s:
              s = s.replace("import android.app.NotificationChannel", "import android.Manifest\nimport android.app.NotificationChannel")
          if "import android.content.pm.PackageManager" not in s:
              s = s.replace("import android.content.pm.ServiceInfo", "import android.content.pm.PackageManager\nimport android.content.pm.ServiceInfo")
          if "import android.os.Build" not in s:
              s = s.replace("import android.os.IBinder", "import android.os.Build\nimport android.os.IBinder")
          if "import androidx.core.content.ContextCompat" not in s:
              s = s.replace("import androidx.core.app.ServiceCompat", "import androidx.core.app.ServiceCompat\nimport androidx.core.content.ContextCompat")
          old = '''    private fun updateNotification(progress: Int, text: String, ongoing: Boolean = true) {
              getSystemService(NotificationManager::class.java).notify(NOTIFICATION_ID, notification(progress, text, ongoing))
          }'''
          new = '''    private fun updateNotification(progress: Int, text: String, ongoing: Boolean = true) {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                  ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
              ) return
              getSystemService(NotificationManager::class.java).notify(NOTIFICATION_ID, notification(progress, text, ongoing))
          }'''
          if old not in s:
              raise SystemExit("ExportForegroundService updateNotification contract not found")
          s = s.replace(old, new)
          p.write_text(s)

          p = root / "app/src/main/java/com/toucabr/editor/MainActivity.kt"
          s = p.read_text()
          if "ActivityResultContracts" not in s:
              s = s.replace("package com.toucabr.editor\n\nimport android.os.Bundle", "package com.toucabr.editor\n\nimport android.Manifest\nimport android.content.pm.PackageManager\nimport android.os.Build\nimport android.os.Bundle")
              s = s.replace("import androidx.activity.ComponentActivity", "import androidx.activity.ComponentActivity\nimport androidx.activity.result.contract.ActivityResultContracts")
              s = s.replace("import androidx.activity.viewModels", "import androidx.activity.viewModels\nimport androidx.core.content.ContextCompat")
              s = s.replace(
                  "    private val viewModel: EditorViewModel by viewModels()",
                  "    private val viewModel: EditorViewModel by viewModels()\n    private val notificationPermissionLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { }",
              )
              s = s.replace(
                  "        enableEdgeToEdge()",
                  """        enableEdgeToEdge()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      notificationPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                  }""",
              )
          p.write_text(s)
          PY

          cd wip10-build/ToucaEditorAndroid
          mkdir -p app/src/main/assets/whisper

          REV=c4eb0c76e35cab5b948da877b438dcd6d91d93f4
          curl -fL --retry 4 --retry-delay 2 \
            "https://huggingface.co/Xenova/whisper-tiny/resolve/${REV}/onnx/encoder_model_quantized.onnx?download=true" \
            -o app/src/main/assets/whisper/encoder_model_quantized.onnx
          curl -fL --retry 4 --retry-delay 2 \
            "https://huggingface.co/Xenova/whisper-tiny/resolve/${REV}/onnx/decoder_model_merged_quantized.onnx?download=true" \
            -o app/src/main/assets/whisper/decoder_model_merged_quantized.onnx
          curl -fL --retry 4 --retry-delay 2 \
            "https://huggingface.co/KitsuMate/whisper-tiny-onnx/resolve/main/tokenizer.json?download=true" \
            -o app/src/main/assets/whisper/tokenizer.json

          echo "fd9d995b9dcb0520f0dbf6cf68651af639fc385f594d9d876e69ca2802dc438e  app/src/main/assets/whisper/encoder_model_quantized.onnx" | sha256sum -c -
          echo "6c0c125986b007d2e3734bec84c18bda0152071b90b87fadac6d7764499927a0  app/src/main/assets/whisper/decoder_model_merged_quantized.onnx" | sha256sum -c -
          echo "27fc476bfe7f17299480be2273fc0608e4d5a99aba2ab5dec5374b4482d1a566  app/src/main/assets/whisper/tokenizer.json" | sha256sum -c -

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Unit tests
        working-directory: wip10-build/ToucaEditorAndroid
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        working-directory: wip10-build/ToucaEditorAndroid
        shell: bash
        run: |
          set +e
          gradle lintDebug --stacktrace --no-daemon
          STATUS=$?
          REPORT=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo "===== FULL LINT REPORT ====="
            cat "$REPORT"
            echo "===== END LINT REPORT ====="
          fi
          exit $STATUS

      - name: Assemble APK
        working-directory: wip10-build/ToucaEditorAndroid
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK=wip10-build/ToucaEditorAndroid/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          apksigner verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          ls -lh "$APK"
          sha256sum "$APK" > ToucaEditor-WIP10-debug.apk.sha256
          cp "$APK" ToucaEditor-WIP10-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ToucaEditor-WIP10-build
          path: |
            ToucaEditor-WIP10-debug.apk
            ToucaEditor-WIP10-debug.apk.sha256
            wip10-build/ToucaEditorAndroid/app/build/reports/lint-results-debug.html
            wip10-build/ToucaEditorAndroid/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 7
